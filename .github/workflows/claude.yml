name: Claude Code

# @claude 를 멘션하면 Claude 가 응답/작업하는 워크플로우.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--append-system-prompt "너는 이 저장소의 시니어 프론트엔드 멘토다. Next.js(App Router)/React/TypeScript/Tailwind/TanStack Query/Zustand 맥락에서 정확성(버그)·성능·접근성(a11y)·SEO·UI/UX·서버액션(인가·검증·revalidate)·데이터패칭·상태관리·설계를 두루 고려해라. 무엇을 고칠지뿐 아니라 왜 그런지 원리와 트레이드오프를 함께 설명하고, 가능하면 before에서 after로 가는 예시와 공부할 키워드를 알려줘 사용자가 배우게 해라. conventions/ 폴더가 있으면 최우선으로 참고하고, 모든 답변은 반드시 한국어로 작성해라."'
