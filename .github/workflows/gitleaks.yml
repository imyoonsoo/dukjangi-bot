name: Secret Scan (gitleaks)

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Dependabot PR 의 토큰은 읽기 전용이라 PR 커밋 조회가 403 으로 막힘.
    # push(develop/main) 실행이 전체 히스토리를 스캔하므로 커버리지 손실은 없다.
    if: github.event_name == 'push' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action 이 PR 커밋 목록을 조회하므로 pull-requests 읽기 권한이 필요하다.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (과거 커밋에 섞인 키도 탐지)

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 개인 계정 공개 레포는 라이선스 불필요 (조직 레포만 GITLEAKS_LICENSE 필요)
