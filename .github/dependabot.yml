version: 2
updates:
  # npm 의존성 업데이트
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # 보안 알림은 주기와 무관
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    # 메이저는 직접 업데이트
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 이상 요구로 제외
      - dependency-name: "@vitest/eslint-plugin"
    # 위 그룹부터 우선 적용
    # 함께 올려야 하는 패키지 묶음
    # 나머지 minor, patch는 한 PR로 묶음
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions 업데이트
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # 보안 알림은 주기와 무관
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: ["ci"]
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
